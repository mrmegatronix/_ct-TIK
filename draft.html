<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ct-matrix - TikTok Module Preview</title>
  
  <!-- Swiper JS & CSS from CDN for Preview Purposes -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <style>
    :root {
      --matrix-bg: #121214;
      --matrix-card-bg: #1a1a1e;
      --matrix-border: #2d2d34;
      --matrix-text: #ffffff;
      --matrix-text-muted: #a1a1aa;
      --matrix-accent: #ff0050; /* TikTok Pink */
      --matrix-accent-cyan: #00f2fe; /* TikTok Cyan */
    }

    body {
      background-color: var(--matrix-bg);
      color: var(--matrix-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ct-matrix Dashboard Widget Grid Wrapper Simulation */
    .matrix-widget-container {
      width: 100%;
      max-width: 480px;
      background: var(--matrix-card-bg);
      border: 1px solid var(--matrix-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--matrix-border);
      padding-bottom: 12px;
    }

    .widget-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-title span {
      background: linear-gradient(90deg, var(--matrix-accent), var(--matrix-accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .widget-status {
      font-size: 12px;
      color: var(--matrix-text-muted);
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* Slideshow Custom Layout Styles */
    .swiper {
      width: 100%;
      height: 580px;
      border-radius: 12px;
      background: #000;
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    /* TikTok Video Responsive Wrapper */
    .tiktok-embed-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Swiper Navigation Custom Colors */
    .swiper-button-next, .swiper-button-prev {
      color: #fff !important;
      background: rgba(0, 0, 0, 0.6);
      width: 40px !important;
      height: 40px !important;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .swiper-button-next::after, .swiper-button-prev::after {
      font-size: 16px !important;
      font-weight: bold;
    }

    .swiper-pagination-bullet-active {
      background: var(--matrix-accent) !important;
    }

    .widget-footer {
      margin-top: 15px;
      text-align: center;
    }

    .widget-footer a {
      color: var(--matrix-text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }

    .widget-footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- ct-matrix Rendered Module Container -->
  <div class="matrix-widget-container">

    <!-- Swiper Slideshow HTML structure -->
    <div class="swiper mySwiper">

        <!-- Slide 2: TikTok Video Embed -->

              <section>
                <a target="_blank" href="https://www.tiktok.com/@coasterstavernredwood?refer=embed">@coasterstavernredwood</a>
              </section>
            </blockquote>
          </div>
        </div>

      </div>

      <!-- Navigation Arrows -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <!-- Pagination Dots -->
      <div class="swiper-pagination"></div>
    </div>

    <div class="widget-footer">
      <a href="https://www.tiktok.com/@coasterstavernredwood" target="_blank" rel="noopener">
        🔗 @coasterstavernredwood on TikTok
      </a>
    </div>
  </div>

  <!-- Official TikTok Embed Script -->
  <script async src="https://www.tiktok.com/embed.js"></script>

    <div class="widget-footer">
      <a href="https://tiktok.com" target="_blank" rel="noopener">

  <!-- Initialize Swiper Script Component -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const swiper = new Swiper(".mySwiper", {
        direction: "horizontal",
        loop: true,
        spaceBetween: 10,
        grabCursor: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        keyboard: {
          enabled: true,
        }
      });
    });
  </script>
</body>
</html>
